{% extends "admin_dashboard/base.html" %}

{% block content %}

<div class="card shadow">

    <div class="card-header">
        <h3>{{ title }}</h3>
    </div>

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button class="btn btn-success">
                Save Category
            </button>

            <a href="{% url 'admin_dashboard:category_list' %}"
               class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
