{% extends "admin_dashboard/base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Categories</h2>

    <a href="{% url 'admin_dashboard:add_category' %}"
       class="btn btn-primary">
        <i class="bi bi-plus-circle"></i>
        Add Category
    </a>
</div>

<div class="card shadow-sm">
    <div class="card-body">

        <table class="table table-hover align-middle">

            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Slug</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>

                {% for category in categories %}

                <tr>

                    <td>{{ category.id }}</td>

                    <td>{{ category.name }}</td>

                    <td>{{ category.slug }}</td>

                    <td>

                        <a href="{% url 'admin_dashboard:edit_category' category.id %}"
                           class="btn btn-warning btn-sm">
                            Edit
                        </a>

                        <a href="{% url 'admin_dashboard:delete_category' category.id %}"
                           class="btn btn-danger btn-sm">
                            Delete
                        </a>

                    </td>

                </tr>

                {% empty %}

                <tr>
                    <td colspan="4" class="text-center">
                        No categories found.
                    </td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>
</div>

{% endblock %}
