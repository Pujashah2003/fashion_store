{% extends "admin_dashboard/base.html" %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-body text-center">

        <h3 class="mb-4">

            Delete "{{ product.name }}" ?

        </h3>

        <form method="POST">

            {% csrf_token %}

            <button class="btn btn-danger">

                Yes, Delete

            </button>

            <a href="{% url 'admin_dashboard:product_list' %}"
               class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
