<!-- Navbar -->
<nav class="bg-black text-white shadow-md">
    <div class="max-w-7xl mx-auto px-6">

        <div class="flex justify-between items-center h-16">

            <a href="/" class="text-2xl font-bold tracking-[2px]">
                Fashion Store
            </a>

            <div class="flex items-center space-x-6">

                <a href="/" class="hover:text-gray-300">
                    Home
                </a>

                <a href="{% url 'products:product_list' %}" class="hover:text-gray-300">
                    Products
                </a>

                <a href="{% url 'cart:cart' %}" class="hover:text-gray-300 relative inline-flex items-center gap-1.5">
                    <span>Cart</span>
                    {% if cart_item_count > 0 %}
                        <span class="bg-[#9b5b3e] text-white text-xs font-bold px-2 py-0.5 rounded-full">
                            {{ cart_item_count }}
                        </span>
                    {% endif %}
                </a>

                {% if user.is_authenticated %}

                    <a href="{% url 'orders:order_list' %}" class="hover:text-gray-300">
                        My Orders
                    </a>

                    <span class="text-gray-300">
                        Hi, {{ user.first_name|default:user.username }}
                    </span>

                    <a href="{% url 'logout' %}"
                       class="bg-red-500 px-4 py-2 rounded hover:bg-red-600 text-sm font-medium">
                        Logout
                    </a>

                {% else %}

                    <a href="{% url 'login' %}"
                       class="hover:text-gray-300">
                        Login
                    </a>

                    <a href="{% url 'register' %}"
                       class="bg-white text-black px-4 py-2 rounded hover:bg-gray-200 text-sm font-medium">
                        Register
                    </a>

                {% endif %}

            </div>

        </div>

    </div>
</nav>
