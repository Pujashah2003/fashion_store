{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Fashion Store{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block extra_head %}{% endblock %}
</head>
<body class="bg-[#f8f6f1] text-gray-900 min-h-screen flex flex-col">

    <!-- NAVBAR -->
    {% include 'Navbar.html' %}

    <!-- FLASH MESSAGES -->
    {% if messages %}
    <div class="max-w-7xl mx-auto px-6 pt-4 w-full">
        {% for message in messages %}
            <div class="p-4 rounded mb-3 text-sm flex items-center justify-between shadow-sm
                {% if message.tags == 'error' %} bg-red-100 border border-red-400 text-red-700
                {% elif message.tags == 'success' %} bg-green-100 border border-green-400 text-green-700
                {% elif message.tags == 'warning' %} bg-yellow-100 border border-yellow-400 text-yellow-700
                {% else %} bg-blue-100 border border-blue-400 text-blue-700 {% endif %}">
                <span>{{ message }}</span>
                <button onclick="this.parentElement.remove()" class="font-bold text-gray-600 hover:text-gray-900 ml-4">&times;</button>
            </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- MAIN CONTENT -->
    <main class="flex-grow">
        {% block content %}
        {% endblock %}
    </main>

    <!-- FOOTER -->
    {% include 'footer.html' %}

</body>
</html>
