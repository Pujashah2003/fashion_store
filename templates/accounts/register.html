{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h2>Create Account</h2>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">
            <label>Username</label>

            <input
                type="text"
                name="username"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label>Email</label>

            <input
                type="email"
                name="email"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label>Password</label>

            <input
                type="password"
                name="password"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label>Confirm Password</label>

            <input
                type="password"
                name="confirm_password"
                class="form-control"
                required
            >
        </div>

        <button type="submit" class="btn btn-dark">
            Register
        </button>

    </form>

    <p class="mt-3">
        Already have an account?
        <a href="{% url 'login' %}">Login</a>
    </p>

</div>

{% endblock %}
