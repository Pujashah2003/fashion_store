{% load static %}

<!DOCTYPE html>
<html>

<head>

<title>{{product.name}}</title>

<link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>


<body>


<div class="container">


<div class="product-detail">


<img src="{{product.image.url}}">


<div class="detail-info">


<h1>
{{product.name}}
</h1>


<h3>
Category:
{{product.category.name}}
</h3>


<p>
{{product.description}}
</p>


<h2>
Rs. {{product.price}}
</h2>


<button>
Add To Cart
</button>


</div>


</div>


</div>


</body>

</html>
