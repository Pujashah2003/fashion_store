{% extends "base.html" %}

{% block title %}
Products
{% endblock %}

{% block content %}

<h1>All Products</h1>

{% for product in products %}

<div>
    <h3>{{ product.name }}</h3>

    <p>{{ product.description }}</p>

    <strong>Rs. {{ product.price }}</strong>

    <hr>
</div>

{% empty %}

<p>No products available.</p>

{% endfor %}

{% endblock %}
